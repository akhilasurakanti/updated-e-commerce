<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - E-Commerce</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .gallery-img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center mb-4">Product Gallery</h2>
        <div class="row">
            <div class="col-md-4">
                <img src="https://source.unsplash.com/300x300/?laptop" class="img-fluid gallery-img" alt="Laptop">
            </div>
            <div class="col-md-4">
                <img src="https://source.unsplash.com/300x300/?smartphone" class="img-fluid gallery-img" alt="Smartphone">
            </div>
            <div class="col-md-4">
                <img src="https://source.unsplash.com/300x300/?headphones" class="img-fluid gallery-img" alt="Headphones">
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-md-4">
                <img src="https://source.unsplash.com/300x300/?shoes" class="img-fluid gallery-img" alt="Shoes">
            </div>
            <div class="col-md-4">
                <img src="https://source.unsplash.com/300x300/?makeup" class="img-fluid gallery-img" alt="Makeup">
            </div>
            <div class="col-md-4">
                <img src="https://source.unsplash.com/300x300/?furniture" class="img-fluid gallery-img" alt="Furniture">
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
